name: Daily Motivation Twitter Bot Cron

on:
  schedule:
    # Monday through Saturday at 9:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1-6'
    # Sunday Reset at 6:00 PM EST (22:00 UTC)
    - cron: '0 22 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  post-daily-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Post via Webhook
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "::error::No RENDER_SERVICE_URL configured. Go to Settings > Secrets and variables > Actions to add RENDER_SERVICE_URL and CRON_SECRET."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${RENDER_SERVICE_URL%/}"

          # Step 1: Send a quick wake-up ping in case Render is in a cold sleep
          echo "Sending wake-up ping to ${CLEAN_URL}/ping..."
          curl -sS -I --connect-timeout 60 --max-time 90 "${CLEAN_URL}/ping" || true

          # Step 2: Determine appropriate endpoint (Sunday Reset vs Daily)
          DAY_OF_WEEK=$(date -u +%u) # 1=Mon, ..., 7=Sun
          if [ "$DAY_OF_WEEK" -eq 7 ]; then
            ENDPOINT="${CLEAN_URL}/cron/sunday"
          else
            ENDPOINT="${CLEAN_URL}/cron/daily"
          fi

          echo "Triggering post webhook: ${ENDPOINT}"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" --connect-timeout 60 --max-time 120 -X GET "${ENDPOINT}?secret=${CRON_SECRET}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "Response Body: $HTTP_BODY"
          echo "Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Post webhook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "Post triggered successfully!"

name: Daily Motivation Twitter Bot Cron

on:
  schedule:
    # Daily Main Post at 9:00 AM EST (13:00 UTC)
    - cron: '0 13 * * *'
    # Spaced Growth Loop Outreach Slots (11:30 AM, 3:30 PM, 7:30 PM EST -> 15:30, 19:30, 23:30 UTC)
    - cron: '30 15,19,23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
    inputs:
      action:
        description: 'Action to trigger (daily or engage)'
        required: false
        default: 'daily'

jobs:
  run-bot-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bot Webhook
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "::error::No RENDER_SERVICE_URL configured. Go to Settings > Secrets and variables > Actions to add RENDER_SERVICE_URL and CRON_SECRET."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${RENDER_SERVICE_URL%/}"

          # Step 1: Send a quick wake-up ping in case Render is in a cold sleep
          echo "Sending wake-up ping to ${CLEAN_URL}/ping..."
          curl -sS -I --connect-timeout 60 --max-time 90 "${CLEAN_URL}/ping" || true

          # Step 2: Route to /cron/daily or /cron/engage based on schedule or manual input
          if [ "$INPUT_ACTION" = "engage" ] || [ "$EVENT_SCHEDULE" = "30 15,19,23 * * *" ]; then
            ENDPOINT="${CLEAN_URL}/cron/engage"
            QUERY_PARAMS="secret=${CRON_SECRET}&count=1&mode=auto"
          else
            ENDPOINT="${CLEAN_URL}/cron/daily"
            QUERY_PARAMS="secret=${CRON_SECRET}"
          fi

          echo "Triggering webhook: ${ENDPOINT}"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" --connect-timeout 60 --max-time 120 -X GET "${ENDPOINT}?${QUERY_PARAMS}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "Response Body: $HTTP_BODY"
          echo "Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Post webhook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "Post triggered successfully!"
